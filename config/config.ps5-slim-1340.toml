# PS5 Agent Configuration (PS5 Slim / Firmware 13.40)
data_dir = "/data/ps5-agent"

[inference]
base_url = "http://127.0.0.1:8081/v1"
model = "qwen-loaded"
# Supported PS5LM api_mode values: chat_completions, responses, anthropic_messages, completions, system_one
api_mode = "chat_completions"
timeout_secs = 120
connect_timeout_secs = 5
context_limit = 8192
max_output_tokens = 1024
stream_enabled = true
max_retries = 2
thinking_level = "medium"
auto_sync_from_ps5lm = true
auto_sync_interval_secs = 30
prefill_kv_cache = true
cache_prompt = true
temperature = 0.4
dynatemp_range = 0.0
dynatemp_exponent = 1.0
top_k = 40
top_p = 0.95
min_p = 0.05
typical_p = 1.0
xtc_probability = 0.0
xtc_threshold = 0.1
top_n_sigma = -1.0
repeat_penalty = 1.05
repeat_last_n = 256
presence_penalty = 0.0
frequency_penalty = 0.0
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 2
dry_penalty_last_n = -1
mirostat = 0
mirostat_tau = 5.0
mirostat_eta = 0.1
seed = -1
ignore_eos = false
stop_sequences = []
n_keep = 0
id_slot = -1
samplers = ""
grammar = ""
reasoning_format = "deepseek"
timings_per_token = false
custom_extra_body_json = ""
smart_tool_routing = true
cache_type_k = ""
cache_type_v = ""
flash_attn = false

[server]
bind_host = "0.0.0.0"
port = 8080
max_body_bytes = 1048576
upload_max_body_bytes = 67108864
allow_lan_only = true

[database]
driver = "auto"
path = "/data/ps5-agent/database/agent.db"
busy_timeout_ms = 5000
cache_size_kb = 4000
# Rollback TRUNCATE mode avoids mmap(MAP_SHARED) .db-shm crashes on PS5 /data
wal_mode = false
retention_days = 30
max_rows_per_table = 10000

[security]
# Set auth_enabled = true to require dashboard/API login, or false to disable auth on a trusted LAN
auth_enabled = true
admin_username = "admin"
# Optional: set an explicit admin password (at least 8 chars) instead of generating bootstrap_credentials.txt
# admin_password = "change-me-at-least-8-chars"
session_ttl_hours = 24
rate_limit_per_minute = 240
login_rate_limit_per_minute = 10
require_approval_for_mutating = true
argon2_memory_kib = 8192

[agents]
max_agents = 0
max_active_tasks = 0
max_queued_tasks = 0
max_concurrent_inference = 4
max_messages_per_task = 0
max_reasoning_iterations = 0
default_task_timeout_secs = 0
allow_temporary_specialists = true
on_disable_policy = "cancel"

[memory]
max_memories_per_agent = 0
archive_after_messages = 40
keep_recent_messages = 16
max_context_memories = 8
max_memory_context_chars = 3200

[tools]
allowed_paths = ["/data/ps5-agent/workspace"]
allowed_domains = ["*"]
block_private_lan_web_requests = true
default_timeout_secs = 20
max_file_bytes = 2097152
max_web_bytes = 524288

[logging]
level = "info"
log_dir = "/data/ps5-agent/logs"
max_file_bytes = 2097152
ring_buffer_capacity = 500
enable_klog = true
enable_toast = true

[runtime]
tokio_worker_threads = 2
health_poll_interval_secs = 15
rest_mode_recovery = true

[sandbox]
mode = "full_sandbox"
approval_policy = "full_auto"
network_access = true
allow_local_network = false
web_search_provider = "duckduckgo"
searxng_url = ""
brave_api_key = ""
tavily_api_key = ""
remote_browser_url = ""
allow_host_shell = false
max_exec_output_bytes = 262144
exec_timeout_secs = 20
inject_brain_files = true
max_brain_context_chars = 4000
heartbeat_interval_secs = 0
