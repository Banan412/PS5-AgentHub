# Local Host Development / Verification Configuration
data_dir = "./data/ps5-agent"

[inference]
base_url = "http://127.0.0.1:18081/v1"
model = "qwen-3.5-9b-mock"
# Supported PS5LM api_mode values: chat_completions, responses, anthropic_messages, completions, system_one
api_mode = "chat_completions"
timeout_secs = 30
connect_timeout_secs = 5
context_limit = 8192
max_output_tokens = 1024
stream_enabled = true
max_retries = 1

[server]
bind_host = "127.0.0.1"
port = 18080
max_body_bytes = 1048576
allow_lan_only = true

[database]
driver = "sqlite"
path = "./data/ps5-agent/database/agent.db"
busy_timeout_ms = 5000
cache_size_kb = 4000
wal_mode = true

[security]
auth_enabled = true
admin_username = "admin"
session_ttl_hours = 24
rate_limit_per_minute = 240
login_rate_limit_per_minute = 20
require_approval_for_mutating = false
argon2_memory_kib = 19456

[agents]
max_agents = 5
max_active_tasks = 4
max_queued_tasks = 64
max_concurrent_inference = 1
max_messages_per_task = 20
max_reasoning_iterations = 8
allow_temporary_specialists = true
on_disable_policy = "cancel"

[memory]
max_memories_per_agent = 500
archive_after_messages = 40
keep_recent_messages = 16
max_context_memories = 8
max_memory_context_chars = 3200

[tools]
allowed_paths = ["./data/ps5-agent/workspace"]
allowed_domains = ["*"]
block_private_lan_web_requests = true
default_timeout_secs = 20
max_file_bytes = 2097152
max_web_bytes = 524288

[logging]
level = "debug"
log_dir = "./data/ps5-agent/logs"
max_file_bytes = 2097152
ring_buffer_capacity = 500
enable_klog = false
enable_toast = false

[runtime]
tokio_worker_threads = 2
health_poll_interval_secs = 15
rest_mode_recovery = true

[sandbox]
mode = "full_sandbox"
approval_policy = "full_auto"
network_access = true
allow_local_network = false
web_search_provider = "duckduckgo"
allow_host_shell = false
inject_brain_files = true
max_brain_context_chars = 16000
heartbeat_interval_secs = 0
