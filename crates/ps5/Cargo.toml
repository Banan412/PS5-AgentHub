[package]
name = "ps5"
description = "Safe wrappers over the PS5 payload SDK"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[target.'cfg(target_vendor = "sie")'.dependencies]
ps5-sys = { path = "../ps5-sys" }

# Enable only what a payload uses: each module links its Sony libraries.
# Core (fmt, klog, payload, fw_version) needs no feature.
[features]
default = []
full = ["alloc", "notify", "hw", "random", "app", "system", "http"]
# Heap (libc malloc) + pthread threads and Mutex; no extra Sony libs.
alloc = []
notify = ["ps5-sys/notification"]
hw = ["ps5-sys/kernel-sys"]
random = ["ps5-sys/random"]
app = ["ps5-sys/app-inst-util", "system"]
system = ["ps5-sys/user-service", "ps5-sys/system-service"]
http = ["ps5-sys/ssl", "ps5-sys/http2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("sie"))', 'cfg(mio_unsupported_force_waker_pipe)'] }
